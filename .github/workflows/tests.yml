name: Tests

on:
  push:
    branches: [ "main" ]
  # Every pull request, whatever its base, so stacked PRs (base = another
  # feature branch) get CI before their parent merges. A push to a PR's *base*
  # branch fires nothing here; CONTRIBUTING.md ("Stacked PRs") says how to
  # re-run the PRs stacked on it (#231).
  pull_request:
    types: [opened, synchronize, reopened]
  # Retargeting re-runs the suite through retarget.yml, which calls this
  # workflow only when the base changed. An `edited` trigger here would post
  # skipped check runs under these job names for every title or body edit,
  # and the checks page would show those instead of the real results (#346).
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels its still-running, now superseded runs. A retarget
# (called from retarget.yml, with the caller's `edited` event context) gets its
# own group: cancelling the run for the old base would leave its jobs marked
# cancelled under the real check names, which is the shadowing #346 removed.
# Pushes to main group per commit: a group holds one running and one pending
# run, and a third arrival cancels the pending one even without
# cancel-in-progress, so merges in quick succession would leave main commits
# without a completed run.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'edited' && '-retarget' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ruff and mypy are configured in pyproject.toml but were never enforced. One
  # interpreter is enough: the rule set depends on the pinned ruff version, not
  # on the interpreter, and [tool.mypy] fixes python_version = "3.12" itself.
  # The tools come from uv.lock so a ruff release cannot change the rule set
  # under an open PR; Dependabot bumps them like every other dev dependency.
  # --all-extras so mypy sees matplotlib, scikit-learn and pennylane-lightning:
  # with ignore_missing_imports, a missing extra silently types its imports as Any.
  # ruff covers the whole tree (it respects .gitignore). mypy covers the package,
  # tests/ and examples/ in full: since #232 no module is exempted.
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies from the lockfile
      run: uv sync --locked --all-extras

    # The pre-commit hook refuses large files at commit time, but hooks are
    # opt-in per clone; this applies the same limit to every tracked file.
    - name: Refuse large files
      run: uv run --frozen python .github/scripts/check_large_files.py

    - name: Lint
      run: uv run --frozen ruff check .

    - name: Check formatting
      run: uv run --frozen ruff format --check .

    # warn_unused_configs reports an override entry that matches no module (a
    # renamed or deleted file) only as a note and still exits 0, so the grep
    # turns that note into a failure, should [[tool.mypy.overrides]] entries
    # be added again.
    - name: Type-check
      run: |
        out=$(uv run --frozen mypy hqnn_forge tests examples 2>&1) || { echo "$out"; exit 1; }
        echo "$out"
        if grep -q "unused section(s)" <<< "$out"; then
          echo "::error::a [[tool.mypy.overrides]] entry in pyproject.toml matches no module"
          exit 1
        fi

    # The floor is repeated by hand in pyproject.toml and in this file (ruff's
    # target-version, the classifiers, vermin's -t and each job's lowest
    # python-version), and in the local vermin commands in README.md and
    # CONTRIBUTING.md; each tool only sees its own copy, so a missed one would
    # fail nothing. The script compares them all with requires-python.
    - name: Check every copy of the Python floor
      run: uv run --frozen python .github/scripts/check_python_floor.py

    # Neither ruff nor mypy checks stdlib API usage against the 3.11 floor:
    # ruff's target-version covers syntax only, and mypy has to target 3.12
    # because the numpy stubs use PEP 695 syntax. vermin fails on a call such
    # as itertools.batched or Path.walk that only exists from 3.12 on.
    # --exclude long: vermin reads torch's Tensor.long() on a local as the
    # Python 2 long builtin, marks the file "incompatible" and drops its
    # minimum while still exiting 0. That skip is silent, so the grep below
    # turns any remaining "File with incompatible versions" line into a failure.
    - name: Check stdlib usage against the 3.11 floor
      run: |
        out=$(uv run --frozen vermin --no-tips -t=3.11- --violations --eval-annotations \
          --exclude long hqnn_forge tests examples .github/scripts 2>&1) || { echo "$out"; exit 1; }
        echo "$out"
        if grep -q "File with incompatible versions" <<< "$out"; then
          echo "::error::vermin skipped the files above; their minimum version was not checked"
          exit 1
        fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    # Every extra the suite can import, which is the same set the locked job
    # installs with --all-extras below. An extra left out here does not fail the
    # job: tests/test_evaluation_plots.py and tests/test_sklearn_estimator.py
    # skip their whole module when matplotlib or scikit-learn is missing, so the
    # tests would just stop running. Keep the two jobs' sets identical.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,lightning,sklearn,examples]"
        
    # A missing extra would otherwise turn its tests into skips and the job
    # would still pass; with this set, any skip not marked may_skip fails.
    - name: Run pytest
      env:
        HQNN_FORGE_FAIL_ON_SKIP: "1"
      run: |
        pytest tests/ -v

    # The >>> examples in the package's docstrings, which drift silently
    # otherwise. Run in every job so they hold at the floors and the lock too.
    - name: Run doctests
      run: pytest --doctest-modules hqnn_forge -v

  # The matrix above installs the latest versions satisfying the open ">=" floors,
  # which is the early warning that an upstream release broke us. This job installs
  # the exact resolution recorded in uv.lock instead, so a Dependabot lockfile bump
  # is tested against the versions it actually changes. --locked additionally fails
  # if uv.lock has drifted out of sync with pyproject.toml.
  #
  # Both interpreters are run because uv.lock resolves per interpreter: the core
  # stack carries python_full_version markers, so the oldest supported version and
  # the newest can install different pins from the same lockfile. A job on one
  # interpreter only would go green without installing the other half of a bump.
  test-locked:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies from the lockfile
      run: uv sync --locked --all-extras

    # Skips fail here too, as in the test job above.
    - name: Run pytest
      env:
        HQNN_FORGE_FAIL_ON_SKIP: "1"
      run: uv run --frozen pytest tests/ -v

    - name: Run doctests
      run: uv run --frozen pytest --doctest-modules hqnn_forge -v

  # The two matrices above never install the declared floors: test resolves to
  # the newest versions the ">=" constraints allow and test-locked to whatever
  # uv.lock pins, so a floor in pyproject.toml is otherwise only tested by
  # coincidence, and a lockfile bump can silently leave it untested. This job
  # installs every direct runtime dependency at exactly its floor (transitive
  # ones resolve normally) on 3.11, the requires-python floor, and on each
  # interpreter that has floors of its own, so every floor is exercised on
  # every PR and has to be raised when it stops working.
  #
  # Only the runtime deps and the lightning and sklearn extras are resolved
  # lowest. The dev tools are declared without floors, and lowest-direct would
  # pick mypy 0.1, which does not build; examples adds only matplotlib, also
  # without a floor, to the scikit-learn already covered by sklearn. pytest is
  # installed afterwards at its normal resolution, using the spec from the dev
  # extra, which leaves the runtime pins untouched.
  test-lowest:
    runs-on: ubuntu-latest
    # One leg per set of floors: pyproject.toml gives torch, numpy and
    # scikit-learn a higher floor on 3.13 and on 3.14, where the older
    # releases have no wheels. 3.12 shares the 3.11 floors.
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        # Without a suffix this job shares the test-locked cache key of the
        # same interpreter and the two would restore each other's
        # (differently resolved) cache
        cache-suffix: lowest-direct

    - name: Install the declared floors
      run: |
        uv venv
        uv pip install --resolution lowest-direct -e ".[lightning,sklearn]"
        PYTEST_SPEC=$(uv run --no-sync python -c 'import re, tomllib; print(next(d for d in tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"] if re.match(r"pytest\s*[<>=!~]", d)))')
        uv pip install "$PYTEST_SPEC"

    # The resolver silently installs a newer version when another dependency
    # requires one, so an unreachable floor would otherwise still go green
    - name: Check every floor was installed
      run: uv run --no-sync python .github/scripts/check_floors.py

    # Skips fail here too, which also catches an extra that installs at its
    # floor but does not work (a lightning.qubit that cannot create a device).
    # matplotlib is not installed in this job by design, so its one module is
    # left out explicitly rather than skipped.
    - name: Run pytest
      env:
        HQNN_FORGE_FAIL_ON_SKIP: "1"
      run: uv run --no-sync pytest tests/ -v --ignore=tests/test_evaluation_plots.py

    - name: Run doctests
      run: uv run --no-sync pytest --doctest-modules hqnn_forge -v
