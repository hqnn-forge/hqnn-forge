name: Release

# Publishes a tagged version to PyPI and creates the GitHub release (#321).
#
#   git tag v0.1.0 <merge commit of the release PR> && git push origin v0.1.0
#
# The tag must equal "v" + project.version, sit on a commit of main, and
# CHANGELOG.md must have a non-empty "## [0.1.0]" section; the build job checks
# all three before anything is built, and nothing is published unless the
# build checks and the locked test suite (the test job) pass on that commit.
# Publishing uses PyPI trusted publishing (OIDC), so no token is stored in the
# repository.  It needs a one-time setup on PyPI and TestPyPI -- a trusted
# publisher for this repository, workflow release.yml and environment "pypi" /
# "testpypi" -- and the two environments in the repository settings, where
# "pypi" MUST require the owner as reviewer and allow only "v*" tags: a job
# naming an environment that does not exist creates it without protection.
#
# A manual run (workflow_dispatch) is a dry run of main: it builds and tests
# main's head and uploads it to TestPyPI only. It refuses any other ref, so a
# feature branch never reaches TestPyPI under a version main will use.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # Full history, so the tagged commit can be checked against main.
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: "3.12"
    - name: Check a dry run is of main
      if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
      run: |
        echo "::error::a dry run builds main; this run is on $GITHUB_REF."
        exit 1
    - name: Check the tag against pyproject.toml and CHANGELOG.md
      if: github.event_name == 'push'
      run: python .github/scripts/release_notes.py check "$GITHUB_REF_NAME"
    # CONTRIBUTING: a release is tagged on a main merge commit. A tag pushed on
    # an unmerged branch commit would otherwise publish unreviewed code.
    - name: Check the tagged commit is on main
      if: github.event_name == 'push'
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
          exit 1
        fi
    - name: Rewrite README.md for PyPI
      run: python .github/scripts/pypi_readme.py --in-place
    - name: Build the sdist and wheel
      run: uv build
    - name: Restore README.md
      run: git checkout -- README.md
    - name: Check the distributions' metadata
      run: uvx twine check --strict dist/*
    - name: Check the wheel contains no Mermaid fence
      run: |
        python -c "
        import glob, sys, zipfile
        (whl,) = glob.glob('dist/*.whl')
        with zipfile.ZipFile(whl) as z:
            meta = next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))
            if '```mermaid' in z.read(meta).decode('utf-8'):
                print('::error::wheel METADATA contains a mermaid fence', file=sys.stderr)
                sys.exit(1)
        "
    - name: Check the wheel installs, imports and reports project.version
      run: |
        uv venv /tmp/wheel-check
        uv pip install --python /tmp/wheel-check dist/*.whl
        expected=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        # From outside the checkout, so the wheel is imported, not ./hqnn_forge.
        cd /tmp
        /tmp/wheel-check/bin/python -c "import hqnn_forge, hqnn_forge.models, hqnn_forge.encoding; v = hqnn_forge.__version__; assert v == '$expected', (v, '$expected'); print(v)"
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  # The locked suite and doctests on the exact commit being released, as the
  # test-locked job in tests.yml runs them, so a publish never rests only on an
  # earlier run of another commit.
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: "3.12"
    - name: Install dependencies from the lockfile
      run: uv sync --locked --all-extras
    - name: Run pytest
      env:
        HQNN_FORGE_FAIL_ON_SKIP: "1"
      run: uv run --frozen pytest tests/
    - name: Run doctests
      run: uv run --frozen pytest --doctest-modules hqnn_forge

  publish-pypi:
    if: github.event_name == 'push'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hqnn-forge/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    # Pinned to a commit, as the one action given id-token: write; Dependabot
    # updates the pin and its version comment.
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github-release:
    if: github.event_name == 'push'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Create the GitHub release from the changelog section
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python .github/scripts/release_notes.py notes "$GITHUB_REF_NAME" > notes.md
        prerelease=""
        if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi
        gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
          --notes-file notes.md $prerelease

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hqnn-forge/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/
        # A second dry run of the same version must not fail on the upload, but
        # it uploads nothing: TestPyPI keeps the first upload of each version,
        # so only the first dry run of a version exercises trusted publishing.
        skip-existing: true
