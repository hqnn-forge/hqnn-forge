version: 2
updates:
  # Tracks uv.lock only. Dependabot's uv ecosystem updates the lockfile without
  # rewriting the constraints in pyproject.toml, which is deliberate: the runtime
  # floors there are open (">=") and raised by hand when a version actually breaks.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "vermin"

  # Keeps the actions in every workflow current (checkout, setup-python,
  # setup-uv, the artifact and pages actions, and pypi-publish); without this
  # entry none would ever be updated. release.yml, docs.yml, docs-build.yml
  # and upstream.yml pin their actions to commit SHAs with version comments
  # (see the comment at the top of release.yml's jobs: for the rationale);
  # tests.yml stays on tags; retarget.yml and dispatch.yml only call other
  # workflows. Dependabot bumps the tags in tests.yml, and the SHA pins
  # together with their version comments everywhere else. They arrive in
  # one grouped PR rather than one each: they are reviewed identically and each
  # ungrouped PR would spend a full matrix run to say the same thing.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
