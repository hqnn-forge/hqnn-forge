[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hqnn_forge"
module-root = ""

[project]
name = "hqnn-forge"
version = "0.1.0"
description = "Parameter-efficient Hybrid Quantum Neural Networks for imbalanced tabular classification."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "HQNN-Forge Contributors" }]
keywords = [
    "quantum machine learning",
    "hybrid quantum neural network",
    "PennyLane",
    "PyTorch",
    "NISQ",
    "fraud detection",
    "imbalanced classification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

# Every floor below is installed by the test-lowest CI job (--resolution
# lowest-direct) on 3.11, 3.13 and 3.14, so each one is the lowest version the
# suite actually passes on for its interpreters. A package whose oldest usable
# release has no wheels for a newer interpreter gets one floor per interpreter
# range: the first release with wheels for it. 3.12 shares the 3.11 floors.
dependencies = [
    # 2.2 wheels were compiled against NumPy 1.x and fail to initialise NumPy 2.
    # First cp313 wheels: 2.5; first cp314 wheels: 2.9.
    "torch>=2.3; python_version < '3.13'",
    "torch>=2.5; python_version == '3.13'",
    "torch>=2.9; python_version >= '3.14'",
    # 0.38 breaks with autoray>=0.7 (NumpyMimic removed) and PennyLane declares
    # no upper bound of its own
    "pennylane>=0.45",
    # pennylane>=0.45 already requires numpy>=2.0, so a lower floor is unreachable.
    # First cp313 wheels: 2.1; first cp314 wheels: 2.3.2.
    "numpy>=2.0; python_version < '3.13'",
    "numpy>=2.1; python_version == '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
]

[project.urls]
Homepage = "https://github.com/hqnn-forge/hqnn-forge"
Documentation = "https://hqnn-forge.github.io/hqnn-forge/"
Repository = "https://github.com/hqnn-forge/hqnn-forge"
Issues = "https://github.com/hqnn-forge/hqnn-forge/issues"
Changelog = "https://github.com/hqnn-forge/hqnn-forge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
lightning = [
    "pennylane-lightning>=0.45",  # enables adjoint diff on CPU
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "vermin",
    # Oracle for the Wilcoxon and ranking tests in tests/test_evaluation_statistics.py;
    # hqnn_forge itself stays pure NumPy. 1.13 is the first release that installs
    # alongside numpy>=2.0. pennylane brings scipy too, but only by coincidence.
    "scipy>=1.13",
    # tests/test_amplitude_embedding.py imports packaging.version.Version to
    # compare PennyLane versions; hqnn_forge itself never imports it. 20.0 is the
    # oldest release whose specifiers and version parsing satisfy the test dependencies;
    # pytest and PennyLane bring packaging too, but only by coincidence.
    "packaging>=20.0",
    # Independent reference for the Rydberg solver in tests/test_rydberg_reference.py
    # (mesolve); hqnn_forge itself never imports it. The test-lowest job installs
    # these floors next to the newest scipy, which pennylane brings there: 5.1.1 is
    # the first release that imports with scipy>=1.17 (5.1.0 and older import
    # scipy.special.sph_harm, removed in 1.17), and it has cp311 to cp313 wheels and
    # runs on numpy 2.0. First cp314 wheels: 5.2.2.
    "qutip>=5.1.1; python_version < '3.14'",
    "qutip>=5.2.2; python_version >= '3.14'",
]
sklearn = [
    # hqnn_forge.sklearn needs validate_data and __sklearn_tags__, both new in 1.6.
    # First cp314 wheels: 1.7.2.
    "scikit-learn>=1.6; python_version < '3.14'",
    "scikit-learn>=1.7.2; python_version >= '3.14'",
]
examples = [
    # dataset generation in examples, and hqnn_forge.sklearn; floors as in sklearn
    "scikit-learn>=1.6; python_version < '3.14'",
    "scikit-learn>=1.7.2; python_version >= '3.14'",
    "matplotlib",
]

[dependency-groups]
docs = [
    # The API reference site: mkdocs build --strict (docs/, mkdocs.yml).  A group,
    # not an extra: users never need it, and CI's `--all-extras` jobs stay without it.
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
    # docs/griffe_sphinx_roles.py hooks griffe's on_package event (griffe 1.14+);
    # an older griffe never fires it, and the roles then render as literal text
    # without failing the strict build.  2.0.3 is the first mkdocstrings-python
    # to require griffelib>=2.0 (earlier ones allow griffe 1.13).
    "mkdocstrings-python>=2.0.3",
]

# ruff is the only formatter and linter; black is deliberately not declared,
# so there is one line length (99) and one formatting style (see #133)
[tool.ruff]
line-length = 99
target-version = "py311"

