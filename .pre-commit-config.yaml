# Runs ruff check and ruff format before each commit, with the settings from
# [tool.ruff] in pyproject.toml.
#
# Local hooks run ruff through `uv run --frozen`, so they use the ruff version
# pinned in uv.lock: the same one the CI lint job runs, with no second version
# to keep in step when Dependabot bumps the lockfile. `--extra dev` makes sure
# ruff is installed in the project environment.
#
# The file types match the upstream ruff-pre-commit defaults and what CI's
# `ruff check .` and `ruff format --check .` discover: `ruff format` also
# formats the Python code blocks in Markdown files, `ruff check` does not.
# `--force-exclude` keeps ruff's own exclusions in effect when pre-commit
# passes file names explicitly.
repos:
  # Refuses a commit that adds a file over the limit: a non-redistributable
  # dataset, a checkpoint or a plot dump (#220).  The largest tracked file is
  # uv.lock at about 480 KB, so 1000 KB leaves it headroom.  CI runs the same
  # limit, read from this line, over every tracked file
  # (.github/scripts/check_large_files.py), since hooks are opt-in per clone.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --extra dev ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
